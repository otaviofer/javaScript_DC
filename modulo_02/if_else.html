<html>
    <meta charset="UTF-8">
    <script>
        // CONDIÇÕES - IF ELSE

        var numero = 10;
        var nome = "Otávio";

        if(nome == "felipe"){   // se for verdadeiro...
            console.log("Verdadeiro!");
        }else if(nome == "otávio"){     // senão, se...
            console.log("Entramos no else if. Verdadeiro!");
        }else{  // senão...
            console.log("Falso");
        }

        /*
        VERIFICAÇÕES:

        == igual
        >= maior ou igual
        > maior
        <= menor ou igual
        < menor

        */

    </script>
</html>
