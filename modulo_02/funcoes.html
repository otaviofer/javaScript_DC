<html>
    <meta charset="UTF-8">
    <script>
        // FUNÇÕES

        // declarando uma função
        function testes(){
            // cód executado quando chamar a função
            console.log("Chamando a função testes!");
        }

        // passagem de parâmetros
        function testes2(nome, idade){  // posso passar mais de um parâmetro
            console.log("O nome é: " + nome);
            console.log("A idade é: " + idade);
            console.log("--------------------");
        }

        function pegarNome(parametro){   // função pora retornar algum valor
            if(parametro == 1){
                return "Eluana";    // a partir do return a função é encerrada
            }else{
                return "Outro nome";
            }
        }

        var nome = pegarNome(1);

        console.log(nome);

        /*
        testes2("Otávio", 27);

        testes();   // chamando a função
        */

    </script>
</html>
