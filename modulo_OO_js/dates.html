<html>
  <meta charset="UTF-8" />
  <body>
    <script>
      // MAIS SOBRE DATAS
      // EXERCÍCIO: CALCULAR DIFERENÇAS DE DATAS

      const date = new Date('04/15/2026'); // padrão norte-americano 'mm/dd/aa'

      const date2 = new Date('04/17/2026');

      const diferenca = (date2.getTime() - date.getTime()) / (1000 * 3600 * 24); // 1000 = 1s; 3600s = 1h; 24h => conta para transformar milissegundos em dias
      alert(diferenca);

    </script>
  </body>
</html>
