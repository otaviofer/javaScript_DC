<html>
  <!-- ** REQUISIÇÃO COM FETCH ** -->

  <head>
    <meta charset="UTF-8" />
    <title>Modulo AJAX</title>
  </head>
  <body>
    <script>
        // feature mais usada hoje para requisição ajax
      fetch("https://jsonplaceholder.typicode.com/todos/1")
        .then((response) => response.json())
        .then((json) => console.log(json));
    </script>
  </body>
</html>
